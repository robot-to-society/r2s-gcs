[workspace]
resolver = "2"
members = ["crates/rgcs-core", "crates/rgcs-mavlink", "crates/rgcs-store", "apps/rgcs-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
rgcs-core = { path = "crates/rgcs-core" }
rgcs-mavlink = { path = "crates/rgcs-mavlink" }
rgcs-store = { path = "crates/rgcs-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "12.0", features = ["serde-compat"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mavlink = { version = "0.19.1", default-features = false, features = ["std", "tokio", "transport-udp", "transport-tcp", "transport-direct-serial", "serde", "dialect-ardupilotmega", "dialect-common", "format-generated-code", "mav2-message-extensions"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
toml = "1.1"
futures = "0.3"
anyhow = "1.0"
dashmap = "6"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower = "0.5"
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
